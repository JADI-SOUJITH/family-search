<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Logs</title>
    <style>
        body{
            margin:0;
            padding:40px;
            background:#020617;
            color:white;
            font-family:Arial,sans-serif;
        }
        h1{
            margin:0 0 24px;
            font-size:40px;
        }
        .status{
            color:#94a3b8;
            margin-bottom:20px;
        }
        .card{
            background:#111827;
            padding:20px;
            border-radius:16px;
            margin-bottom:16px;
            border:1px solid rgba(255,255,255,0.06);
        }
        .error{
            color:#fca5a5;
            margin-top:12px;
        }
    </style>
</head>
<body>
    <h1>Search Logs</h1>
    <div class="status" id="status">Loading...</div>
    <div id="logs"></div>

    <script>
        const API_URL =
          window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
            ? "http://localhost:3000"
            : "https://family-search-g6t8.onrender.com";

        async function loadLogs(){
            const statusEl = document.getElementById("status");
            const logsEl = document.getElementById("logs");

            try{
                const res = await fetch(`${API_URL}/logs`, { cache: "no-store" });

                if(!res.ok){
                    throw new Error(`HTTP ${res.status}`);
                }

                const data = await res.json();

                if(!Array.isArray(data) || data.length === 0){
                    statusEl.textContent = "No logs yet.";
                    logsEl.innerHTML = "";
                    return;
                }

                statusEl.textContent = `${data.length} log(s) found`;

                logsEl.innerHTML = data.map(item => `
                    <div class="card">
                        <div><strong>Search Box 1:</strong> ${item.searchBox1 ?? "null"}</div>
                        <div style="margin-top:10px;"><strong>Search Box 2:</strong> ${item.searchBox2 ?? "null"}</div>
                        <div style="margin-top:10px;"><strong>Time:</strong> ${item.time ?? "unknown"}</div>
                    </div>
                `).join("");
            }catch(err){
                statusEl.textContent = "Failed to load logs.";
                logsEl.innerHTML = `<div class="error">${err.message}</div>`;
            }
        }

        loadLogs();
    </script>
</body>
</html>
