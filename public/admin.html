<!DOCTYPE html>
<html>

<head>
    <title>Logs</title>
</head>

<body>

    <h2>Search Logs</h2>

    <div id="logs"></div>

    <script>

        async function load(){

            const res=await fetch("/logs");

            const data=await res.json();

            let html="";

            data.forEach(item=>{

                html+=`
                    <p>
                        Search Box 1: ${item.searchBox1}
                        <br><br>

                        Search Box 2: ${item.searchBox2}
                        <br><br>

                        Time: ${item.time}
                    </p>
                    <hr>
                `;

            });

            document.getElementById("logs").innerHTML=html;

        }

        load();

    </script>

</body>

</html>
