<!DOCTYPE html>
<html>

<head>
    <title>Search</title>
</head>

<body>

    <h1>Search</h1>

    <input id="search1" placeholder="Search Box 1">
    <button onclick="go1()">Search 1</button>

    <br><br>

    <input id="search2" placeholder="Search Box 2">
    <button onclick="go2()">Search 2</button>

    <script>

        async function go1(){

            const query=document.getElementById("search1").value;

            const res=await fetch("/search",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    box1:query,
                    box2:null
                })
            });

            const data=await res.json();

            window.location=data.redirect;

        }

        async function go2(){

            const query=document.getElementById("search2").value;

            const res=await fetch("/search",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    box1:null,
                    box2:query
                })
            });

            const data=await res.json();

            window.location=data.redirect;

        }

    </script>

</body>

</html>
